# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "vprofile IAC"

on:
  push:
    branches: [main, stage]
    paths: [terraform/**]
  pull_request:
    branches: [main, stage]
    paths: [terraform/**]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${BUCKET_TF_STATE}" \
            -backend-config="region=us-east-1" \
            -backend-config="key=vprofile/terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -out=planfile

      - name: Terraform Apply
        id: apply
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && success() }}
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile

      - name: Export Terraform Outputs
        run: |
          REGION=$(terraform output -raw region | tr -d '\n')
          CLUSTER_NAME=$(terraform output -raw cluster_name | tr -d '\n')
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV
          echo "EKS_CLUSTER=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Get kubeconfig file
        if: steps.apply.outcome == 'success'
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Install ingress controller
        if: steps.apply.outcome == 'success' && github.event_name == 'push'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/aws/deploy.yaml
